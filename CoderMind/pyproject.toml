[project]
name = "cmind-cli"
version = "0.1.3"
description = "CoderMind CLI - A tool to generate feature trees for repository planning and code generation."
requires-python = ">=3.12"
dependencies = [
    "typer",
    "rich",
    "httpx[socks]",
    "platformdirs",
    "readchar",
    "truststore>=0.10.4",
    "pydantic>=2.0.0",
    "pytest",
    "tree-sitter",
    "tree-sitter-json",
    "networkx",
    "rank_bm25",
    "rapidfuzz",
    "libcst",
    "json5",
    "tiktoken",
    "tqdm",
    "openai>=1.0.0",
    "anthropic>=0.20.0",
    "mcp>=1.0.0",
    "pyyaml>=6.0"
]

[project.scripts]
cmind = "cmind_cli:main"
cmind-mcp = "cmind_cli.entries:mcp_main"

[project.urls]
Repository = "https://github.com/microsoft/RPG-ZeroRepo"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/cmind_cli"]

# Bundle core assets (scripts + slash-command templates) into the wheel under
# `cmind_cli/core_pack/` so that `cmind init` works offline (air-gapped /
# corporate-proxy / enterprise environments).  These are the SAME source files
# the GitHub Release zip workflow packages; bundling them in the wheel just
# gives users a network-free fast path.  Plan: plans/01-package-bundle-and-ai-config.md
[tool.hatch.build.targets.wheel.force-include]
"scripts"            = "cmind_cli/core_pack/scripts"
"templates/commands" = "cmind_cli/core_pack/commands"

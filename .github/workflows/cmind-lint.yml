name: CoderMind Lint

permissions:
  contents: read

on:
  push:
    branches: [main]
    paths:
      - "CoderMind/**"
      - ".github/workflows/cmind-*.yml"
      - ".github/workflows/scripts/cmind/**"
      - ".markdownlint-cli2.jsonc"
  pull_request:
    paths:
      - "CoderMind/**"
      - ".github/workflows/cmind-*.yml"
      - ".github/workflows/scripts/cmind/**"
      - ".markdownlint-cli2.jsonc"
  workflow_dispatch:

jobs:
  markdownlint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Run markdownlint-cli2
        uses: DavidAnson/markdownlint-cli2-action@v19
        with:
          globs: |
            CoderMind/**/*.md
